&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {

          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

#ogana-conversao-v1 [hidden] { display: none !important; }
#ogana-conversao-v1 .prototype-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; justify-content: space-between; margin-block-end: 12px; }
#ogana-conversao-v1 .prototype-result { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
#ogana-conversao-v1 .prototype-dialog { max-inline-size: min(390px, calc(100% - 32px)); padding: 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--card-foreground); }
#ogana-conversao-v1 .prototype-dialog::backdrop { background: color-mix(in srgb, var(--foreground) 36%, transparent); }
#ogana-conversao-v1 .prototype-dialog-note { color: var(--muted-foreground); font-size: 13px; margin-block-end: 6px; }
#ogana-conversao-v1 .prototype-dialog h2 { margin-block-end: 8px; }
#ogana-conversao-v1 .prototype-dialog button { margin-block-start: 16px; }

#ogana-conversao-v1 .ogana-page {
  --paper: #F7F5ED;
  --surface: #FFFFFF;
  --ink: #292333;
  --quiet: #686370;
  --brand: #513080;
  --pressed: #39225A;
  --lilac: #EEE8F5;
  --gold: #E9B824;
  --line: #DED9E4;
  --gutter: clamp(20px, 5.25cqi, 58px);
  container-type: inline-size;
  background: var(--paper);
  color: var(--ink);
  color-scheme: light;
  font: 400 16px/1.55 Inter, system-ui, sans-serif;
  text-align: start;
}
#ogana-conversao-v1 .ogana-page.mobile { max-inline-size: 390px; margin-inline: auto; }
#ogana-conversao-v1 .ogana-page :where(*, *::before, *::after) { box-sizing: border-box; }
#ogana-conversao-v1 .ogana-page :where(h1,h2,h3,p,ol) { margin: 0; }
#ogana-conversao-v1 .ogana-page :where(a,button):focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }
#ogana-conversao-v1 .ogana-page h2 { color: var(--ink); font-size: clamp(24px, 3.6cqi, 38px); font-weight: 750; line-height: 1.14; letter-spacing: -.04em; text-wrap: balance; }
#ogana-conversao-v1 .ogana-wrap { max-inline-size: 1180px; padding-inline: var(--gutter); margin-inline: auto; }
#ogana-conversao-v1 .ogana-header { border-block-end: 1px solid var(--line); }
#ogana-conversao-v1 .ogana-header-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 14px; min-block-size: 66px; }
#ogana-conversao-v1 .ogana-brand-link { display: inline-flex; align-items: center; min-block-size: 44px; }
#ogana-conversao-v1 .ogana-brand { display: block; inline-size: 96px; block-size: auto; }
#ogana-conversao-v1 .ogana-header nav { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
#ogana-conversao-v1 .ogana-header nav a { display: inline-flex; align-items: center; min-block-size: 44px; color: var(--brand); font-size: 14px; font-weight: 600; text-decoration: none; }
#ogana-conversao-v1 .ogana-header nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
#ogana-conversao-v1 .ogana-header nav .ogana-nav-referral { text-decoration: underline; text-underline-offset: 4px; }
#ogana-conversao-v1 .ogana-hero { display: grid; grid-template-columns: minmax(0,1.08fr) minmax(0,1fr); align-items: center; gap: clamp(25px,5.2cqi,58px); padding-block: clamp(38px, 6cqi, 67px); }
#ogana-conversao-v1 .ogana-hero h1 { color: var(--ink); font-size: clamp(38px,6.15cqi,66px); font-weight: 800; line-height: 1.04; letter-spacing: -.055em; text-wrap: balance; }
#ogana-conversao-v1 .ogana-hero h1 span { display: block; color: var(--brand); }
#ogana-conversao-v1 .ogana-hero-copy &gt; p:first-of-type { max-inline-size: 33ch; margin-block: 16px 21px; color: var(--quiet); }
#ogana-conversao-v1 .ogana-action,
#ogana-conversao-v1 .ogana-secondary { font: inherit; }
#ogana-conversao-v1 .ogana-action,
#ogana-conversao-v1 .ogana-secondary {
  display: inline-flex; align-items: center; justify-content: center; min-block-size: 48px;
  padding: 10px 18px; border: 1px solid var(--brand); border-radius: 9px;
  background: var(--brand); color: var(--surface); font-size: 14px; font-weight: 700;
}
#ogana-conversao-v1 .ogana-action:hover { background: var(--pressed); }
#ogana-conversao-v1 .ogana-secondary { background: var(--surface); color: var(--brand); }
#ogana-conversao-v1 .ogana-secondary:hover { background: var(--lilac); }
#ogana-conversao-v1 .ogana-cta-note,
#ogana-conversao-v1 .ogana-beta { color: var(--quiet); font-size: 13px; margin-block-start: 7px; }
#ogana-conversao-v1 .ogana-devices { position: relative; aspect-ratio: 1.12; overflow: hidden; border-radius: 20px; background: var(--lilac); }
#ogana-conversao-v1 .ogana-devices img { position: absolute; display: block; max-inline-size: none; block-size: auto; }
#ogana-conversao-v1 .ogana-device-company { z-index: 1; inline-size: 112%; inset-inline-start: -19%; inset-block-start: -11%; }
#ogana-conversao-v1 .ogana-device-affiliate { inline-size: 104%; inset-inline-start: 17%; inset-block-start: -7%; }
#ogana-conversao-v1 .ogana-flow { background: var(--surface); border-block: 1px solid var(--line); padding-block: clamp(26px, 4cqi, 43px); }
#ogana-conversao-v1 .ogana-flow-panel { padding: clamp(21px, 3.4cqi, 36px); border-radius: 18px; background: var(--lilac); }
#ogana-conversao-v1 .ogana-flow-intro { margin-block-start: 7px; color: var(--quiet); }
#ogana-conversao-v1 .ogana-steps { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 20px; margin-block: 23px 17px; padding: 0; list-style: none; }
#ogana-conversao-v1 .ogana-steps li { display: flex; align-items: center; gap: 10px; }
#ogana-conversao-v1 .ogana-steps h3 { color: var(--ink); font-size: 15px; font-weight: 700; line-height: 1.4; }
#ogana-conversao-v1 .ogana-step-icon { display: grid; place-items: center; flex: none; inline-size: 36px; block-size: 36px; border-radius: 9px; background: var(--surface); color: var(--brand); }
#ogana-conversao-v1 .ogana-step-icon svg { inline-size: 18px; block-size: 18px; }
#ogana-conversao-v1 .ogana-steps li:first-child .ogana-step-icon { background: var(--gold); color: var(--ink); }
#ogana-conversao-v1 .ogana-flow-note { color: var(--quiet); font-size: 14px; }
#ogana-conversao-v1 .ogana-referrers,
#ogana-conversao-v1 .ogana-close-inner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 22px; padding-block: clamp(29px, 4.3cqi, 46px); }
#ogana-conversao-v1 .ogana-referrers p:first-of-type { margin-block-start: 8px; color: var(--quiet); }
#ogana-conversao-v1 .ogana-close { background: var(--lilac); }

#ogana-conversao-v1 .ogana-plans { padding-block: clamp(30px, 4.7cqi, 52px); }
#ogana-conversao-v1 .ogana-plans-intro,
#ogana-conversao-v1 .ogana-plans-included { margin-block-start: 8px; color: var(--quiet); }
#ogana-conversao-v1 .ogana-plans-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px; margin-block: 20px 16px; padding: 0; list-style: none;
}
#ogana-conversao-v1 .ogana-plan {
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  padding: clamp(16px, 2cqi, 23px); border: 1px solid var(--line); border-radius: 15px;
  background: var(--surface); color: var(--ink);
}
#ogana-conversao-v1 .ogana-plan-featured { border-color: var(--gold); background: var(--brand); color: var(--surface); }
#ogana-conversao-v1 .ogana-plan h3 { font-size: 20px; line-height: 1.2; }
#ogana-conversao-v1 .ogana-plan-featured h3,
#ogana-conversao-v1 .ogana-plan-featured .ogana-plan-saving { color: var(--gold); }
#ogana-conversao-v1 .ogana-plan-price { display: flex; align-items: baseline; gap: 2px 6px; flex-wrap: wrap; color: var(--brand); }
#ogana-conversao-v1 .ogana-plan-price strong { font-size: clamp(23px, 2.9cqi, 31px); line-height: 1.12; letter-spacing: -.035em; }
#ogana-conversao-v1 .ogana-plan-price span,
#ogana-conversao-v1 .ogana-plan-billing,
#ogana-conversao-v1 .ogana-plan-saving,
#ogana-conversao-v1 .ogana-plan-support { font-size: 14px; }
#ogana-conversao-v1 .ogana-plan-featured .ogana-plan-price { color: var(--surface); }
#ogana-conversao-v1 .ogana-plan-saving { color: var(--brand); font-weight: 650; }
#ogana-conversao-v1 .ogana-plan-link {
